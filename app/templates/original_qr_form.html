<script>
// ----------------- helpers de localStorage -----------------
function getHistoryList() {
    try {
        return JSON.parse(localStorage.getItem("qrHistory")) || [];
    } catch (e) {
        console.error("Error leyendo historial:", e);
        return [];
    }
}

function setHistoryList(list) {
    localStorage.setItem("qrHistory", JSON.stringify(list));
}

// ----------------- guardar en historial -----------------
function saveToHistory(url, name) {
    if (!url || !url.trim()) return;
    const history = getHistoryList();

    history.unshift({
        url: url,
        name: name && name.trim() ? name.trim() : "(sin nombre)",
        date: new Date().toLocaleString()
    });

    // opcional: limitar a 50 items
    const limited = history.slice(0, 50);
    setHistoryList(limited);
    renderHistory();
}

// ----------------- renderizar historial (trabaja con <div id="historyList">) -----------------
function renderHistory() {
    const container = document.getElementById("historyList");
    if (!container) return;

    const history = getHistoryList();
    container.innerHTML = ""; // limpiar

    if (history.length === 0) {
        // Mensaje amigable cuando está vacío
        const empty = document.createElement("div");
        empty.style.color = "#666";
        empty.style.fontStyle = "italic";
        empty.textContent = "You haven't generated any QR codes yet. Generate your first code!";
        container.appendChild(empty);
        return;
    }

    // Crear lista de entradas
    history.forEach((item, idx) => {
        const entry = document.createElement("div");
        entry.className = "history-entry";
        entry.style.borderBottom = "1px solid #eee";
        entry.style.padding = "8px 0";

        // Nombre (h3) y fecha
        const title = document.createElement("h3");
        title.textContent = item.name;
        title.style.margin = "0 0 6px 0";

        const meta = document.createElement("div");
        meta.style.fontSize = "12px";
        meta.style.color = "#777";
        meta.textContent = item.date;

        const urlP = document.createElement("p");
        urlP.style.margin = "6px 0";
        urlP.style.wordBreak = "break-all";
        urlP.textContent = item.url;

        // Botones: Re-generate, Open Link, (opcional) Delete
        const btnContainer = document.createElement("div");
        btnContainer.style.marginTop = "6px";
        btnContainer.style.display = "flex";
        btnContainer.style.gap = "8px";

        const regenBtn = document.createElement("button");
        regenBtn.type = "button";
        regenBtn.textContent = "Re-generate";
        regenBtn.addEventListener("click", () => {
            regenerateQR(item.url, item.name);
        });

        const openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.textContent = "Open";
        openBtn.addEventListener("click", () => {
            let final = item.url;
            if (!final.startsWith("http://") && !final.startsWith("https://")) {
                final = "https://" + final;
            }
            window.open(final, "_blank", "noopener");
        });

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => {
            deleteHistoryItem(idx);
        });

        btnContainer.appendChild(regenBtn);
        btnContainer.appendChild(openBtn);
        btnContainer.appendChild(deleteBtn);

        // ensamblar entry
        entry.appendChild(title);
        entry.appendChild(meta);
        entry.appendChild(urlP);
        entry.appendChild(btnContainer);

        container.appendChild(entry);
    });
}

// ----------------- borrar historial completo -----------------
function clearHistory() {
    localStorage.removeItem("qrHistory");
    renderHistory();
}

// ----------------- borrar un item -----------------
function deleteHistoryItem(index) {
    const history = getHistoryList();
    if (index < 0 || index >= history.length) return;
    history.splice(index, 1);
    setHistoryList(history);
    renderHistory();
}

// ----------------- regenerar (rellena inputs y dispara preview) -----------------
function regenerateQR(url, name) {
    const urlInput = document.getElementById("qrUrl");
    const nameInput = document.getElementById("qrName");
    const previewBtn = document.getElementById("previewBtn");

    if (urlInput) urlInput.value = url;
    if (nameInput) nameInput.value = name;

    // Llamar al preview: simulamos click si existe
    if (previewBtn) {
        previewBtn.click();
    } else {
        // alternativamente, llama directamente a la función que genera preview si la tienes
        console.warn("previewBtn no encontrado; asegúrate de tener un botón con id 'previewBtn'");
    }
}

// ----------------- inicialización al cargar la página -----------------
document.addEventListener("DOMContentLoaded", () => {
    // asegurarse de que el botón Clear use la función (si no usas onclick inline)
    const clearBtn = document.getElementById("clearHistoryBtn");
    if (clearBtn) clearBtn.addEventListener("click", clearHistory);

    renderHistory();
});
</script>
